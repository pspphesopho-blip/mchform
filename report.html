  t+=it.nt?'<td class="t"></td><td class="t"></td>':`<td class="t">${hc?Math.round(c*100)/100:''}</td><td class="t">${hg?Math.round(g*100)/100:''}</td>`;
  t+='</tr>'});
 $('tb').innerHTML=t}

 let t='<tr><th class="i">មណ្ឌលសុខភាព</th>'+MONTHS.map(m=>`<th>${m}</th>`).join('')+'<th>ចំនួនខែ</th></tr>';
 const list=$('hc').value?[$('hc').value]:HC;

 $('tb').innerHTML=t}
