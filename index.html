<style>

function ready(){return $('hc').value&&$('year').value&&$('month').value}
async function load(){
 inputs.forEach(i=>i.value='');if(!ready()||API_URL.startsWith('PASTE'))return;
 say('កំពុងផ្ទុកទិន្នន័យ...');
 try{const r=await(await fetch(API_URL+'?'+new URLSearchParams({hc:$('hc').value,year:$('year').value,month:$('month').value,code:$('code').value}))).json();
  if(r.error)return say(r.error,'err');
  if(r.found){inputs.forEach(i=>{if(r.values[i.dataset.id]!==undefined)i.value=r.values[i.dataset.id]});say('បានផ្ទុកទិន្នន័យដែលបានបញ្ជូនពីមុន។ អាចកែហើយបញ្ជូនម្តងទៀត។','ok')}else say('')
 }catch(e){say('មិនអាចផ្ទុកទិន្នន័យបាន។','err')}}
['hc','year','month'].forEach(i=>$(i).onchange=load);
$('rep').onclick=()=>{localStorage.setItem('mch_code',$('code').value);$('rep').href='report.html?'+new URLSearchParams({hc:$('hc').value,year:$('year').value,month:$('month').value})};
$('send').onclick=async()=>{
 if(!ready())return say('សូមជ្រើសរើសមណ្ឌលសុខភាព ឆ្នាំ និងខែ។','err');
 if(API_URL.startsWith('PASTE'))return say('មិនទាន់កំណត់ API_URL។','err');
 const values={};for(const i of inputs){const v=i.value.trim();if(v!==''&&!(Number(v)>=0))return say('សូមបញ្ចូលលេខ ≥ 0 ប៉ុណ្ណោះ។','err');values[i.dataset.id]=v}
 $('send').disabled=true;say('កំពុងបញ្ជូន...');
 try{const r=await(await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({hc:$('hc').value,year:$('year').value,month:$('month').value,code:$('code').value,values})})).json();
  if(r.ok){localStorage.setItem('mch_code',$('code').value);say(r.updated?'បានកែប្រែទិន្នន័យរួចរាល់ ✓':'បានបញ្ជូនរួចរាល់ ✓','ok')}else say(r.error||'បរាជ័យ','err')
 }catch(e){say('បញ្ជូនមិនបាន។ សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត។','err')}
 $('send').disabled=false};
</script></body></html>
